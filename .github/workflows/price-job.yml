# Manual recovery for the price job. The lightweight Cloudflare Worker in
# workers/price-scheduler invokes it every five minutes; GitHub's automatic
# schedule was too infrequent. See docs/price-refresh-reliability.md.
name: Price job

on:
  workflow_dispatch:

# One manual run at a time. The database credit budget also covers the scheduler.
concurrency:
  group: price-job
  cancel-in-progress: false

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron/prices
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          status=$(curl -sS -o report.json -w '%{http_code}' --max-time 150 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://usewatchlist.dev/api/cron/prices)
          cat report.json; echo
          test "$status" = 200
